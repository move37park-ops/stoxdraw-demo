<!doctype html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>STOXDRAW — Social Forecasting Platform</title>
    <meta name="description" content="미래 주가를 직접 그리고, 공개하고, Crowd와 비교하며, 실제 시장과의 결과를 검증 가능한 Record로 축적하는 소셜 포캐스팅 플랫폼" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/variable/pretendardvariable.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                // 10% Accent (Call to Action & Forecast Peak)
                green: '#00D03A',
                'green-aa': '#008236',
                // 30% Supporting Secondary (Consensus & Meta Data)
                blue: '#78ABFF',
                'blue-aa': '#1F7DFF',
                // 60% Dominant Base
                'gray-light': '#EFF3EB',
                'gray-100': '#E5ECE2',
                'gray-200': '#C2CFC0',
                'gray-500': '#586B60',
                'gray-800': '#26362E',
                'gray-900': '#0F1A15',
                'gray-950': '#0A120E',
              }
            },
            fontFamily: {
              sans: [
                '"Pretendard Variable"',
                'Pretendard',
                '-apple-system',
                'BlinkMacSystemFont',
                'system-ui',
                'Roboto',
                '"Helvetica Neue"',
                '"Segoe UI"',
                '"Apple SD Gothic Neo"',
                '"Noto Sans KR"',
                '"Malgun Gothic"',
                'sans-serif'
              ],
              mono: [
                '"Pretendard Variable"',
                'Pretendard',
                '-apple-system',
                'BlinkMacSystemFont',
                'system-ui',
                'sans-serif'
              ],
            },
            fontSize: {
              'h1-m': ['2rem', { lineHeight: '1.2', letterSpacing: '-0.02em' }],
              'h1-d': ['2.5rem', { lineHeight: '1.2', letterSpacing: '-0.02em' }],
              'h2-m': ['1.5rem', { lineHeight: '1.3', letterSpacing: '-0.01em' }],
              'h2-d': ['1.75rem', { lineHeight: '1.3', letterSpacing: '-0.01em' }],
              'h3-m': ['1.125rem', { lineHeight: '1.4', letterSpacing: '0em' }],
              'h3-d': ['1.25rem', { lineHeight: '1.4', letterSpacing: '0em' }],
              'body-std': ['1rem', { lineHeight: '1.6', letterSpacing: '0em' }],
              'caption-std': ['0.875rem', { lineHeight: '1.4', letterSpacing: '0em' }],
            }
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
